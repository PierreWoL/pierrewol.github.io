cv:
  name: Zhenyu Wu
  label: Applied Scientist — LLMs, Structured Data & Knowledge Graphs
  location: Manchester, UK
  image: ""
  summary: >-
    Final-year Computer Science PhD candidate specialising in LLM-based
    structured-data understanding, schema and taxonomy inference, knowledge
    graphs, and agentic data analytics.

  social_networks:
    - network: GitHub
      username: PierreWoL

  sections:
    Experience:
      - company: University of Manchester
        position: Doctoral Researcher — LLMs for Structured Data and Knowledge Construction
        location: Manchester, UK
        start_date: 2022-09
        end_date: 2026-10
        highlights:
          - Designed encoder- and decoder-based systems for inferring entity types, attributes, hierarchies, and semantic relationships from heterogeneous table repositories.
          - Improved F1/Recall by 30–40% and Rand Index by 7–10% over prior approaches across real-world datasets.
          - Built modular Python pipelines with PyTorch, Hugging Face Transformers, and vLLM for batched inference, caching, structured validation, ablations, and reproducible evaluation.
          - Developing an agentic multi-database QA system combining schema linking, structured reasoning, Text-to-SQL, and tool calling with Qwen2.5-14B.

      - company: Singapore University of Technology and Design
        position: Visiting Research Associate
        location: Singapore
        start_date: 2021-04
        end_date: 2022-03
        highlights:
          - Co-developed a unified benchmark for data-stream clustering, published in Proceedings of the ACM on Management of Data (SIGMOD 2023).
          - Implemented CluStream, DenStream, DStream, and DBStream within a shared C++ codebase and reproducible evaluation framework.

